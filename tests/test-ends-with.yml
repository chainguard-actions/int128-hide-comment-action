name: Test ends-with condition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run hide-comment with ends-with condition (no issue-number, exits early)
        uses: .
        with:
          token: ${{ github.token }}
          ends-with: |
            __test_hide_comment_ends_with_no_match_xyz_99999__

      - name: Assert ends-with output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "actual ends-with output: $ACTUAL"
          ACTUAL_TRIM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          EXPECTED_TRIM="__test_hide_comment_ends_with_no_match_xyz_99999__"
          if [ "$ACTUAL_TRIM" != "$EXPECTED_TRIM" ]; then
            echo "FAIL: expected ends-with output to be '$EXPECTED_TRIM' but got '$ACTUAL_TRIM'"
            exit 1
          fi
          echo "PASS: ends-with output matches input"
