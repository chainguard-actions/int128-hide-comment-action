name: Test ends-with output mirrors input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          ends-with: "<!-- /my-suffix -->"
      - name: Assert ends-with output
        env:
          ACTUAL: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "<!-- /my-suffix -->" ]; then
            echo "FAIL: expected '<!-- /my-suffix -->' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
