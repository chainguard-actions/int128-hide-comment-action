name: Test ends-with output passthrough
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          ends-with: "<!-- end-marker -->"
          token: fake-token-for-testing

      - name: Assert ends-with output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "<!-- end-marker -->" ]; then
            echo "FAIL: expected '<!-- end-marker -->' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
