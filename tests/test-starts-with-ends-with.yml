name: Test starts-with and ends-with inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          starts-with: "<!-- bot-comment"
          ends-with: "<!-- end-bot-comment -->"
          issue-number: "1"
          token: ${{ github.token }}
      - name: Assert outputs are echoed back
        env:
          STARTS_WITH: ${{ steps.action.outputs.starts-with }}
          ENDS_WITH: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "starts-with output: $STARTS_WITH"
          echo "ends-with output: $ENDS_WITH"
          if [ "$STARTS_WITH" != "<!-- bot-comment" ]; then
            echo "FAIL: expected starts-with output to be '<!-- bot-comment', got '$STARTS_WITH'"
            exit 1
          fi
          if [ "$ENDS_WITH" != "<!-- end-bot-comment -->" ]; then
            echo "FAIL: expected ends-with output to be '<!-- end-bot-comment -->', got '$ENDS_WITH'"
            exit 1
          fi
          echo "PASS"
