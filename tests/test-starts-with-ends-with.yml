name: Test starts-with and ends-with inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          starts-with: "<!-- bot-comment -->"
          ends-with: "<!-- /bot-comment -->"
          issue-number: "1"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert outputs are set
        env:
          STARTS_WITH: ${{ steps.action.outputs.starts-with }}
          ENDS_WITH: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "starts-with output: $STARTS_WITH"
          echo "ends-with output: $ENDS_WITH"
          if [ "$STARTS_WITH" != "<!-- bot-comment -->" ]; then
            echo "FAIL: expected starts-with output to equal input '<!-- bot-comment -->'"
            exit 1
          fi
          if [ "$ENDS_WITH" != "<!-- /bot-comment -->" ]; then
            echo "FAIL: expected ends-with output to equal input '<!-- /bot-comment -->'"
            exit 1
          fi
          echo "PASS"
