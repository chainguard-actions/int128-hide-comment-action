name: Test multiple conditions with both outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          starts-with: "<!-- terraform-plan -->"
          ends-with: "<!-- /terraform-plan -->"
          contains: "Plan:"
          authors: |
            github-actions[bot]
          issue-number: "1"
      - name: Assert both outputs or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STARTS_WITH: ${{ steps.action.outputs.starts-with }}
          ENDS_WITH: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "outcome: $OUTCOME"
          echo "starts-with output: $STARTS_WITH"
          echo "ends-with output: $ENDS_WITH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STARTS_WITH" != "<!-- terraform-plan -->" ]; then
              echo "FAIL: expected starts-with output to be '<!-- terraform-plan -->' but got '$STARTS_WITH'"
              exit 1
            fi
            if [ "$ENDS_WITH" != "<!-- /terraform-plan -->" ]; then
              echo "FAIL: expected ends-with output to be '<!-- /terraform-plan -->' but got '$ENDS_WITH'"
              exit 1
            fi
            echo "PASS: both outputs match inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
