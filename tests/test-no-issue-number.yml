name: Test without explicit issue-number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          starts-with: "<!-- automated -->"
          ends-with: "<!-- /automated -->"
          token: ${{ github.token }}
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STARTS_WITH_OUT: ${{ steps.action.outputs.starts-with }}
          ENDS_WITH_OUT: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "outcome: $OUTCOME"
          echo "starts-with output: $STARTS_WITH_OUT"
          echo "ends-with output: $ENDS_WITH_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STARTS_WITH_OUT" != "<!-- automated -->" ]; then
              echo "FAIL: expected starts-with output '<!-- automated -->' but got '$STARTS_WITH_OUT'"
              exit 1
            fi
            if [ "$ENDS_WITH_OUT" != "<!-- /automated -->" ]; then
              echo "FAIL: expected ends-with output '<!-- /automated -->' but got '$ENDS_WITH_OUT'"
              exit 1
            fi
            echo "PASS: action succeeded and both outputs match inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context under workflow_dispatch or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
