name: Test starts-with output echoed back
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          starts-with: "<!-- bot-comment -->"
          issue-number: "1"
      - name: Assert starts-with output or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STARTS_WITH: ${{ steps.action.outputs.starts-with }}
        run: |
          echo "outcome: $OUTCOME"
          echo "starts-with output: $STARTS_WITH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STARTS_WITH" != "<!-- bot-comment -->" ]; then
              echo "FAIL: expected starts-with output to be '<!-- bot-comment -->' but got '$STARTS_WITH'"
              exit 1
            fi
            echo "PASS: starts-with output matches input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
