name: Test contains condition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal event payload
        run: |
          echo '{}' > /tmp/event.json
      - id: action
        uses: .
        with:
          contains: "generated by bot"
          token: ${{ github.token }}
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
          GITHUB_REPOSITORY: example/repo
          GITHUB_EVENT_PATH: /tmp/event.json
      - name: Assert action succeeded
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed but got '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action completed successfully with contains condition"
      - name: Assert starts-with output is empty (not provided)
        env:
          ACTUAL: ${{ steps.action.outputs.starts-with }}
        run: |
          echo "actual starts-with output: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty starts-with output but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: starts-with output is empty as expected"
