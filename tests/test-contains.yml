name: Test contains condition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run hide-comment with contains condition (no issue-number, exits early)
        uses: .
        with:
          token: ${{ github.token }}
          contains: |
            __test_hide_comment_contains_no_match_xyz_77777__

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error using contains condition"
