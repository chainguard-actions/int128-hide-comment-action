name: Test contains condition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up event payload
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pull_request_event.json" /tmp/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event.json" >> "$GITHUB_ENV"
          echo "GITHUB_REPOSITORY=int128/hide-comment-action" >> "$GITHUB_ENV"
      - id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REPOSITORY: int128/hide-comment-action
          GITHUB_EVENT_PATH: /tmp/event.json
        with:
          contains: "generated by bot"
          issue-number: "1"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran (outcome is success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"
