name: Test issue-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          issue-number: "1"
          contains: |
            this-string-will-not-match-any-comment
          token: ${{ github.token }}
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with issue-number input"
          echo "PASS"
