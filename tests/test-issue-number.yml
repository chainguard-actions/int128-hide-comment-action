name: Test issue-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          issue-number: "42"
          starts-with: "<!-- hide-comment-test -->"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with issue-number input
        run: |
          echo "Action completed (may fail due to no real GitHub API in act, but input was accepted)"
          echo "PASS: issue-number input was accepted by the action"
