name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          starts-with: "<!-- bot-comment -->"
      - name: Assert action ran successfully
        run: |
          echo "Action completed successfully (no issue-number + non-PR event = early exit)"
          echo "PASS"
