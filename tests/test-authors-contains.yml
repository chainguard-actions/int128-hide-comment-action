name: Test authors and contains inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          authors: |
            github-actions[bot]
            dependabot[bot]
          contains: "automated comment"
          issue-number: "1"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to no real GitHub API in act)"
          echo "PASS: action accepted authors and contains inputs"
