name: Test starts-with condition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          starts-with: "<!-- test-hide-comment-marker -->"
          token: ${{ github.token }}
      - name: Assert starts-with output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.starts-with }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="<!-- test-hide-comment-marker -->"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
