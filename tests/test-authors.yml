name: Test authors input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          authors: |
            github-actions[bot]
          token: ${{ github.token }}
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with authors input"
          echo "PASS"
