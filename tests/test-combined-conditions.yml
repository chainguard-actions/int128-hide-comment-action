name: Test combined starts-with and ends-with conditions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          starts-with: "<!-- bot-comment-start -->"
          ends-with: "<!-- bot-comment-end -->"
          token: fake-token-for-testing

      - name: Assert starts-with output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.starts-with }}
        run: |
          echo "actual starts-with: $ACTUAL"
          if [ "$ACTUAL" != "<!-- bot-comment-start -->" ]; then
            echo "FAIL: starts-with expected '<!-- bot-comment-start -->' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: starts-with output correct"

      - name: Assert ends-with output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.ends-with }}
        run: |
          echo "actual ends-with: $ACTUAL"
          if [ "$ACTUAL" != "<!-- bot-comment-end -->" ]; then
            echo "FAIL: ends-with expected '<!-- bot-comment-end -->' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: ends-with output correct"
