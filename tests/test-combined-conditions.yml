name: Test combined conditions (starts-with and authors)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          authors: "github-actions[bot]"
          starts-with: "<!-- terraform-plan -->"
          ends-with: "<!-- /terraform-plan -->"
          issue-number: "1"
          token: ${{ github.token }}

      - name: Assert outputs reflect inputs when action succeeds
        env:
          STARTS_WITH: ${{ steps.action.outputs.starts-with }}
          ENDS_WITH: ${{ steps.action.outputs.ends-with }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "starts-with output: $STARTS_WITH"
          echo "ends-with output: $ENDS_WITH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STARTS_WITH" != "<!-- terraform-plan -->" ]; then
              echo "FAIL: expected starts-with output '<!-- terraform-plan -->' but got '$STARTS_WITH'"
              exit 1
            fi
            if [ "$ENDS_WITH" != "<!-- /terraform-plan -->" ]; then
              echo "FAIL: expected ends-with output '<!-- /terraform-plan -->' but got '$ENDS_WITH'"
              exit 1
            fi
            echo "PASS: action succeeded and both outputs match inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
